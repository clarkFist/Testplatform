# VCU设备配置文件 - 简化示例版本
# 适用于快速测试和学习使用

description: "VCU设备配置文件 - 简化示例版本"

devices:
  MVCU1_2:
    slot_id: "2"
    name: "主控单元MVCU1_2"
    ip: "20.2.1.10"
    local_ip: "20.2.1.100"
    port: 18125
    enabled: true
    description: "主系统VCU设备 - 槽位2"
    
  SVCU1_3:
    slot_id: "3"
    name: "从控单元SVCU1_3"
    ip: "20.2.1.10"
    local_ip: "20.2.1.101"
    port: 18125
    enabled: true
    description: "从系统VCU设备 - 槽位3"

switches:
  # 系统控制
  SYSTEM_INIT_COMPLETE_FLAG:
    name: "SYSTEM_INIT_COMPLETE_FLAG"
    type: "macro" 
    current_state: "open"
    description: "系统初始化完成标志"
    group: "system_control"
    
  SYSTEM_RUNNING_FLAG:
    name: "SYSTEM_RUNNING_FLAG"
    type: "macro"
    current_state: "open"
    description: "系统运行状态标志"
    group: "system_control"
    
  # 网络通信
  UDP_COMM_ENABLE:
    name: "UDP_COMM_ENABLE"
    type: "macro"
    current_state: "open"
    description: "UDP通信启用"
    group: "network_communication"
    
  TCP_COMM_ENABLE:
    name: "TCP_COMM_ENABLE"
    type: "macro"
    current_state: "closed"
    description: "TCP通信启用"
    group: "network_communication"
    
  # 调试功能
  DEBUG_LOG_ENABLE:
    name: "DEBUG_LOG_ENABLE"
    type: "macro"
    current_state: "closed"
    description: "调试日志启用"
    group: "debug_features"

switch_groups:
  system_control:
    name: "系统控制"
    description: "系统级别的控制开关"
    
  network_communication:
    name: "网络通信"
    description: "网络通信相关开关"
    
  debug_features:
    name: "调试功能"
    description: "调试和测试功能开关" 